[workspace]
resolver = "2"
members = [
    "crates/paint",
    "crates/renderer",
    "crates/text",
    "crates/core",
    "crates/theme",
    "crates/widgets",
    "crates/chart",
    "crates/platform",
    "crates/testing",
    "examples/gallery",
    "examples/todo",
    "examples/dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = ""
rust-version = "1.80"

[workspace.dependencies]
# Crate internal — selalu dirujuk lewat workspace agar versi konsisten.
silka-paint = { path = "crates/paint" }
silka-renderer = { path = "crates/renderer" }
silka-text = { path = "crates/text" }
silka-core = { path = "crates/core" }
silka-theme = { path = "crates/theme" }
silka-widgets = { path = "crates/widgets" }
silka-chart = { path = "crates/chart" }
silka-platform = { path = "crates/platform" }
silka-testing = { path = "crates/testing" }

# Dependensi eksternal terpilih (REKOMENDASI §3) — dikunci di sini agar
# seluruh workspace seragam; diaktifkan per-crate sesuai batas arsitektur.
wgpu              = "29"      # renderer (HANYA di crates/renderer, §3.2)
winit             = "0.30"    # platform shell (§3.1)
raw-window-handle = "0.6"     # jembatan platform <-> renderer tanpa saling tahu
pollster          = "0.4"     # menunggu future wgpu di init; bukan async runtime app
# Front-end WGSL milik wgpu — HANYA dev-dependency crates/renderer, untuk
# memvalidasi shader SDF di unit test tanpa GPU (§9.5). Versi dikunci sama
# dengan wgpu agar tidak ada dua naga di pohon dependensi.
naga              = { version = "29", features = ["wgsl-in"] }

# Escape hatch macOS (INTEGRASI-NATIVE §8) — dipakai untuk CADisplayLink
# (vsync ProMotion-aware, §3.5) DAN di-re-export lewat
# `silka_platform::platform::macos` supaya aplikasi memakai objc2 versi yang
# sama dengan framework. Hanya dikompilasi di target Apple.
objc2             = "0.6"
# `NSUserDefaults` dipakai lifecycle (§6) untuk membaca setelan OS:
# AppleAccentColor, AppleHighlightColor, dan domain com.apple.universalaccess
# (reduce motion / reduce transparency).
objc2-foundation  = { version = "0.3", default-features = false, features = ["std", "NSObjCRuntime", "NSRunLoop", "NSString", "NSUserDefaults"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CADisplayLink", "objc2-core-foundation"] }
# AppKit hanya sebanyak yang dibutuhkan pekerjaan escape hatch yang lazim:
# titlebar transparan + traffic lights (NSWindow/NSView/NSResponder), vibrancy
# (NSVisualEffectView), dan info layar (NSScreen). Fitur dipilih satu-satu:
# `default` objc2-app-kit berarti seluruh AppKit ikut dikompilasi.
objc2-app-kit     = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSVisualEffectView", "NSApplication", "NSColor", "NSWorkspace"] }

# Escape hatch Windows (INTEGRASI-NATIVE §8) — windows-rs, di-re-export lewat
# `silka_platform::platform::windows`. Versi dikunci sama dengan yang sudah
# dipakai `accesskit_windows` di pohon ini agar tidak pernah ada dua pohon
# binding Win32 dalam satu binary. Hanya dikompilasi di target Windows.
windows           = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

# Escape hatch Linux (INTEGRASI-NATIVE §8) — zbus untuk D-Bus (portal, global
# menu, notifikasi lanjutan). Versi dikunci sama dengan yang dipakai
# `atspi`/`accesskit` supaya koneksi D-Bus aksesibilitas dan koneksi milik
# aplikasi memakai runtime zbus yang sama. Hanya dikompilasi di Linux/BSD.
zbus              = "5"

# Text stack (§3.3) — HANYA di crates/text; crate lain berbicara lewat
# `silka-text`, tidak pernah menyentuh cosmic-text/fontdb langsung.
cosmic-text       = "0.17"
fontdb            = { version = "0.23", default-features = false }  # versi wajib sama dengan yang dipakai cosmic-text
# Segmentasi UAX #29 (grapheme cluster + batas kata) — HANYA di crates/text,
# dipakai gerakan caret per grapheme dan klik-ganda per kata di `text_field`
# (§3.3). Versi dikunci sama dengan yang sudah dipakai cosmic-text agar tidak
# ada dua pohon tabel Unicode di satu binary.
unicode-segmentation = "1.13"

# Flex/Grid layout (§3.4) — HANYA di crates/core, dan di sana pun hanya di
# dalam satu modul (`tree::taffy_box`). Kosakata gaya milik kita sendiri
# (`tree::style`) dipetakan ke tipe Taffy di modul itu saja, jadi kode widget
# tidak pernah menyebut `taffy::` — aturan yang sama seperti wgpu (§3.2) dan
# cosmic-text (§3.3). `block_layout`/`float_layout`/`calc` dimatikan: kita
# membangun UI toolkit, bukan browser.
taffy             = { version = "0.13", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }

# Integrasi native P0 (INTEGRASI-NATIVE §1–§2) — HANYA di crates/platform.
# Aturan yang sama seperti wgpu (§3.2) dan Taffy (§3.4): kosakata kita sendiri
# (`silka_platform::{menu, dialog, clipboard, tray, titlebar}`) dipetakan ke
# tipe crate ini di satu modul saja, jadi kode aplikasi tidak pernah menyebut
# `muda::`/`rfd::`/`arboard::`/`tray_icon::`.
#
# `muda` dan `tray-icon` berbagi satu pohon: tray-icon memakai muda untuk menu
# tray-nya, jadi versinya wajib serumpun atau akan ada dua daftar menu global
# dalam satu proses.
muda              = "0.19"
tray-icon         = "0.24"
rfd               = "0.17"    # dialog file/pesan; di Linux lewat XDG portal (ramah Flatpak)
arboard           = "3.6"     # clipboard teks + gambar
window-vibrancy   = "0.6"     # blur behind-window: NSVisualEffectView / acrylic / mica

# Accessibility (§3.8) — output first-class dari render tree, bukan susulan.
# `accesskit` (kosakata node) hidup di crates/core di balik modul `access`;
# `accesskit_winit` (adapter platform) HANYA di crates/platform, sejajar dengan
# aturan "wgpu hanya di crates/renderer" (§3.2). Versi dikunci di sini supaya
# tidak pernah ada dua pohon accesskit di satu binary.
accesskit         = "0.24"
accesskit_winit   = "0.33"

# ---------------------------------------------------------------------------
# Build profiles
#
# Rationale: the dev profile defaults to full debuginfo, which dominates link
# time and made target/ grow past 16 GB. `line-tables-only` keeps file and line
# numbers in panic backtraces — the part we actually read — while dropping the
# variable-level DWARF we never inspect. Linking gets noticeably cheaper, which
# matters because the whole workspace shares a single target directory and cargo
# locks it exclusively: every second saved on a build is a second no other build
# spends queueing behind it.
[profile.dev]
debug = "line-tables-only"

# Dependencies are compiled once and rarely re-linked, so they carry no
# debuginfo at all: their internals are not what we step through.
[profile.dev.package."*"]
debug = false

# Tests are the hot loop of this project; keep them identical to dev so nothing
# is rebuilt when switching between `cargo check` and `cargo test`.
[profile.test]
debug = "line-tables-only"
