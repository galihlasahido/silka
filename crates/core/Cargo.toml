[package]
name = "silka-core"
description = "Signals, view-diff, arena render tree, box constraints, springs, input and accessibility"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Jembatan ke kosakata `accesskit` (§3.8). Menyala secara bawaan: emisi node
# aksesibilitas adalah bagian kontrak, bukan tambahan opsional. Bisa dimatikan
# untuk build headless/embedded yang tidak punya teknologi bantu sama sekali —
# pass a11y-nya sendiri tetap jalan, hanya konversinya yang hilang.
default = ["accesskit"]
accesskit = ["dep:accesskit"]
# Async runtime bridge (§9.6). OFF by default, and deliberately: `silka-core`
# owns no executor, and an application that only needs a handful of concurrent
# requests is better served by `Tasks::spawn_blocking` (one OS thread per task)
# than by pulling a work-stealing scheduler into the binary. Turn it on and
# `Tasks::spawn` accepts a `Future` instead of a closure; nothing else changes,
# because the "result comes back through the channel" half is the same.
tokio = ["dep:tokio"]

[dependencies]
silka-paint.workspace = true
silka-text.workspace = true
# Design tokens (§2.6/§2.7). The utility vocabulary in `view::utility` resolves
# every value through the active theme, so the token types have to be visible
# from here. There is no cycle: `silka-theme` is pure values over `silka-paint`
# and knows nothing about the view or render tree.
silka-theme.workspace = true
taffy.workspace = true         # widget Flex/Grid (§3.4), dipakai `tree::taffy_box` saja
accesskit = { workspace = true, optional = true }
# Only compiled when the `tokio` feature is on. `rt-multi-thread` is the
# fallback runtime `Tasks::spawn` creates when the caller has none of its own;
# `time` is what makes a timeout or a debounce inside a task possible at all.
tokio = { workspace = true, optional = true }
