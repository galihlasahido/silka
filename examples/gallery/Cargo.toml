[package]
name = "silka-gallery"
description = "Gallery app: an interactive demo of every component, doubling as the manual visual test harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
# Rendering headless untuk golden/snapshot test halaman gallery (§9.5):
# halaman yang sama yang tampil di window digambar ke tekstur offscreen lalu
# dihitung pikselnya. Hanya dev-dependency — aplikasi sendiri tidak pernah
# menyentuh backend langsung, ia lewat `silka-platform`.
silka-renderer.workspace = true

# Three small example applications: usage patterns as living documentation
# rather than README snippets that go stale in silence. `test = true` so the
# model unit tests inside them run under `cargo test -p silka-gallery` — an
# example nobody ever tests is an example that rots.
[[example]]
name = "todo"
path = "examples/todo.rs"
test = true

[[example]]
name = "settings"
path = "examples/settings.rs"
test = true

[[example]]
name = "dashboard-mini"
path = "examples/dashboard-mini.rs"
test = true

[dependencies]
silka-widgets.workspace = true
silka-chart.workspace = true
silka-core.workspace = true
silka-theme.workspace = true
silka-platform.workspace = true
silka-paint.workspace = true
silka-text.workspace = true
