[package]
name = "silka-gallery"
description = "Gallery app: demo interaktif setiap komponen sekaligus alat uji visual manual"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
# Rendering headless untuk golden/snapshot test halaman gallery (§9.5):
# halaman yang sama yang tampil di window digambar ke tekstur offscreen lalu
# dihitung pikselnya. Hanya dev-dependency — aplikasi sendiri tidak pernah
# menyentuh backend langsung, ia lewat `silka-platform`.
silka-renderer.workspace = true

[dependencies]
silka-widgets.workspace = true
silka-core.workspace = true
silka-theme.workspace = true
silka-platform.workspace = true
silka-paint.workspace = true
silka-text.workspace = true
