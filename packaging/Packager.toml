# Bundling for the flagship example (SISA-PEKERJAAN §I3).
#
# Consumed by `cargo-packager`:
#
#   cargo packager --release --config packaging/Packager.toml --formats <list>
#
# Why cargo-packager and not cargo-bundle: cargo-bundle produces a `.app` and a
# `.deb` and stops. This pipeline needs `.dmg`, `.msi`, NSIS, AppImage, `.deb`
# and `.rpm` from one description, and it needs the macOS bundle to be signed
# during packaging rather than re-signed afterwards — re-signing a `.dmg` after
# the fact invalidates the notarization ticket stapled to it.
#
# ---------------------------------------------------------------------------
# What this file does NOT do
# ---------------------------------------------------------------------------
#
# It does not carry a signing identity or a certificate thumbprint. Those come
# from the environment in CI (`APPLE_SIGNING_IDENTITY`, and signtool run from
# `.github/scripts/windows-sign.ps1` afterwards) so that this file is safe to
# read, safe to fork, and identical between a local `cargo packager` and a
# release build. A config file with a thumbprint in it is a config file that
# stops working the day the certificate is rotated, in a way nobody can grep for.

product-name = "Silka Dashboard"
identifier = "dev.silka.dashboard"
# Rewritten by the release workflow from the git tag; kept in step with
# `workspace.package.version` in Cargo.toml the rest of the time.
version = "0.1.0"
description = "Digital-lending ERP dashboard built with silka"
long-description = """
The flagship silka example: an ERP dashboard for digital lending, built only
from the framework's public API. It exists to prove the toolkit against a real
application rather than a widget gallery.
"""
authors = ["silka"]
license-file = "../LICENSE"
homepage = ""
category = "Business"

# The binary cargo builds. `main = true` marks the one the bundle launches.
binaries = [{ path = "silka-dashboard", main = true }]

# Formats are chosen per job in the release workflow rather than listed here,
# because each one only builds on its own runner:
#
#   macOS    app, dmg
#   Windows  wix (.msi), nsis (.exe)
#   Linux    appimage, deb, rpm

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
[macos]
# Must match `LSMinimumSystemVersion` in packaging/macos/Info.plist and the
# `minimum_os.macos` floor in the update feed. Three places, one number: the
# release workflow checks they agree before it signs anything.
minimum-system-version = "11.0"
entitlements = "macos/entitlements.plist"
# The hardened runtime is not optional: notarization refuses a bundle without
# it, and Gatekeeper refuses a bundle that is not notarized.
hardened-runtime = true
# Left empty on purpose — see the note at the top of this file. CI exports
# `APPLE_SIGNING_IDENTITY` instead.
signing-identity = ""

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
[windows]
# SHA-1 is dead for Authenticode; anything that still accepts it is a machine
# that should not be running this.
digest-algorithm = "sha256"
# A signature with no timestamp expires with the certificate, which means every
# copy already installed starts failing SmartScreen the day the certificate
# rolls over. Timestamping is what makes a signature outlive its key.
timestamp-url = "http://timestamp.digicert.com"
allow-downgrades = false

[windows.wix]
# Per-user install by default: it needs no elevation, which means the installer
# runs without a UAC prompt and the updater can replace the files afterwards
# without one either.
fips-compliant = false

[nsis]
install-mode = "currentUser"

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
[deb]
# The runtime halves of what .github/scripts/linux-deps.sh installs at build
# time. Only the libraries that are actually dlopened or linked: over-declaring
# turns a missing feature into a failed install.
depends = [
    "libc6",
    "libgcc-s1",
    "libx11-6",
    "libxcursor1",
    "libxi6",
    "libxrandr2",
    "libxkbcommon0",
    "libwayland-client0",
    "libgl1",
    "libdbus-1-3",
]
files = { "/usr/share/applications/dev.silka.dashboard.desktop" = "linux/dev.silka.dashboard.desktop" }

[appimage]
# AppImage bundles its own copies of the libraries a bare distribution may not
# have. The list stays short for the same reason as `deb.depends`: every library
# bundled is a library that no longer gets security updates from the distro.
libs = ["libxkbcommon.so.0", "libwayland-client.so.0"]
